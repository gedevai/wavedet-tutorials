[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wavedet-tutorials"
version = "0.1.0"
description = "Progressive research tutorials for computer vision, wavelets and object detection."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Blek", email = "blekgedeon.ngossanga@etu.uae.ac.ma" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
